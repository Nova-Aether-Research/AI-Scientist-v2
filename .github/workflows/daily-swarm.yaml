name: Daily Nova Aether Swarm Cycle

on:
  schedule:
    - cron: '0 8 * * *'  # 8 AM UTC
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  GITHUB_TOKEN: ${{ secrets.GITHUB_PAT }}   # Uses the PAT you just added

jobs:
  swarm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout swarm repo
        uses: actions/checkout@v4

      - name: Run Grok Swarm Cycle
        run: |
          echo "=== NOVA AETHER SWARM CYCLE STARTED $(date) ==="
          echo "Memory repo: https://github.com/nova-aether-research/memory"
          echo "EIN: 41-4995612"

      - name: Auto-Push Results to Memory Repo
        run: |
          git config --global user.name "Nova Aether Swarm"
          git config --global user.email "swarm@novaaetherresearch.com"
          
          # Clone memory repo using PAT
          git clone https://x-access-token:${{ secrets.GITHUB_PAT }}@github.com/nova-aether-research/memory.git memory-repo
          cd memory-repo
          
          # Create/update log file with today's results (example)
          mkdir -p logs papers
          echo "# Cycle $(date +%Y-%m-%d) Output" > logs/$(date +%Y-%m-%d)-cycle.md
          echo "Generated by autonomous swarm" >> logs/$(date +%Y-%m-%d)-cycle.md
          
          git add .
          git commit -m "Auto-log: Cycle $(date +%Y-%m-%d) from swarm"
          git push origin main || git push origin master
          echo "✅ Results auto-pushed to memory repo"
