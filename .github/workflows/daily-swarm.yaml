name: Daily Nova Aether Swarm Cycle

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_PAT }}

jobs:
  swarm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout swarm repo
        uses: actions/checkout@v4

      - name: Run Grok Swarm Cycle
        run: |
          echo "=== NOVA AETHER SWARM CYCLE STARTED $(date) ==="

      - name: Auto-Push Results to Memory Repo
        run: |
          git config --global user.name "Nova Aether Swarm"
          git config --global user.email "swarm@novaaetherresearch.com"
          
          # Clone memory repo with PAT
          git clone https://x-access-token:${GITHUB_TOKEN}@github.com/nova-aether-research/memory.git memory-repo
          cd memory-repo
          
          # Create today's log
          mkdir -p logs
          cat > logs/$(date +%Y-%m-%d)-auto-cycle.md << EOF
# Cycle $(date +%Y-%m-%d) – Auto-generated by Swarm

**Status:** Test successful  
**Generated at:** $(date)  
**EIN:** 41-4995612  
**Next:** Real EvoOpt-1 experiment results tomorrow.
EOF
          
          git add .
          git commit -m "Auto-log: Cycle $(date +%Y-%m-%d)" || echo "Nothing new to commit"
          git push origin main || git push origin master
          echo "✅ Auto-push completed successfully"
